<!doctype html><html lang="no"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tegnbanken</title><link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Tegnbanken">
<meta name="theme-color" content="#00D7D9" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#06213F" media="(prefers-color-scheme: dark)">
<link rel="preload" href="fonts/Nunito.ttf" as="font" type="font/ttf" crossorigin>
<style>
@font-face{font-family:Nunito;src:url(fonts/Nunito.ttf) format("truetype");font-weight:200 1000;font-display:swap}
:root{--navy:#0A1A3A;--yellow:#FFD84D;--cyan:#8FD9F0;--glass:#ffffff1f;--bg:linear-gradient(#00D7D9 0,#00AEC2 220px,#0A6A96 520px,#0B3E73 900px,#0A2A5A)}
@media (prefers-color-scheme:dark){:root{--bg:linear-gradient(#0A6A96 0,#0B3E73 260px,#0A2A5A 600px,#061733);--glass:#ffffff14}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0A2A5A}
body{margin:0;min-height:100vh;font-family:Nunito,ui-rounded,system-ui,sans-serif;color:#fff;background:var(--bg) no-repeat;background-attachment:fixed}
header{position:sticky;top:0;z-index:5;padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 12px calc(16px + env(safe-area-inset-left));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:#00b9c833}
@media (prefers-color-scheme:dark){header{background:#0a3a6a55}}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.brand svg{width:36px;height:36px;flex:none}
.brand h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.2px}
.search{position:relative}
.search svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:20px;height:20px;pointer-events:none}
input{width:100%;height:54px;font:inherit;font-size:18px;font-weight:800;color:#fff;padding:0 18px 0 48px;border-radius:999px;border:2px solid var(--cyan);background:var(--navy);outline:none;-webkit-appearance:none;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#8fa8c8;font-weight:700}
input:focus{border-color:var(--yellow);box-shadow:0 0 0 4px #FFD84D55}
main{padding:8px calc(16px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.meta{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.8;margin:8px 4px 10px}
#list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.card{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:12px 16px;border-radius:16px;background:#fff;color:var(--navy);font-size:18px;font-weight:800;box-shadow:0 4px 0 #0003;cursor:pointer;transition:transform .1s;animation:in .2s ease both}
@media (prefers-color-scheme:dark){.card{background:#13325c;color:#fff;box-shadow:0 4px 0 #0005}}
.card:active{transform:scale(.97)}
.card svg{width:20px;height:20px;flex:none;opacity:.55}
.card.v svg{opacity:1}
.empty{padding:28px 6px;font-size:15px;font-weight:700;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chips button{font:inherit;font-size:16px;font-weight:800;min-height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--glass);color:#fff}
.chips button:active{background:var(--yellow);color:var(--navy)}
#view{display:none;animation:in .2s ease both}
.top{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
#back{flex:none;width:52px;height:52px;border-radius:18px;border:0;background:var(--yellow);box-shadow:0 4px 0 #0003;display:grid;place-items:center}
#back:active{transform:scale(.96)}
#w{margin:0;font-size:26px;font-weight:1000;line-height:1.15;text-shadow:0 2px 0 #0004}
.stage{border-radius:22px;overflow:hidden;background:#1D3A66;box-shadow:0 6px 0 #0003}
video,img.m{display:block;width:100%}img.m{background:#fff}img.m+img.m{border-top:3px solid #1D3A66}
.none{padding:40px 16px;text-align:center;font-weight:700;opacity:.8}
video{cursor:pointer}
video::-webkit-media-controls,video::-webkit-media-controls-panel,video::-webkit-media-controls-overlay-play-button,video::-webkit-media-controls-start-playback-button,video::-webkit-media-controls-play-button{display:none!important;-webkit-appearance:none;opacity:0}
.ctrl{display:none;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:16px;font-weight:900;min-height:48px;padding:0 18px;border:0;border-radius:999px;background:var(--yellow);color:var(--navy);box-shadow:0 4px 0 #0003}
.pill:active,.seg button:active{transform:scale(.96)}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--navy);border:2px solid var(--cyan)}
.seg button{font:inherit;font-size:15px;font-weight:800;min-height:40px;min-width:72px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:#cfe3f5}
.seg button[aria-pressed=true]{background:var(--yellow);color:var(--navy)}
footer{font-size:12px;font-weight:700;opacity:.65;text-align:center;padding:4px 16px calc(14px + env(safe-area-inset-bottom))}
footer a{color:inherit}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><div class="brand"><svg viewBox="96 96 320 320" aria-hidden="true"><circle cx="256" cy="256" r="150" fill="none" stroke="#fff" stroke-width="30"/><g fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"><path d="M206 300V214M238 300V186M270 300V192M302 300V222"/><path d="M190 280q-10 66 66 66 62 0 62-60v-50"/><path d="M206 300q-24-24-44-6"/></g><path d="M352 150l9 18 20 3-14 14 3 20-18-10-18 10 3-20-14-14 20-3z" fill="#FFD84D" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg><h1>Tegnbanken</h1></div>
<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="#8FD9F0" stroke-width="3" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="7"/><path d="M16 16l5 5"/></svg>
<input id="q" type="search" placeholder="Søk" aria-label="Søk etter tegn" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"></div></header>
<main><div class="meta" id="meta"></div><ul id="list" aria-live="polite"></ul>
<section id="view"><div class="top"><button id="back" aria-label="Tilbake"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A1A3A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg></button><h2 id="w"></h2></div><div class="stage" id="media"></div><div class="ctrl" id="ctrl"><button id="again" class="pill"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg>Spill av igjen</button><div class="seg" role="group" aria-label="Fart"><button data-r="1">Normal</button><button data-r="0.5">0,5x</button></div></div></section></main>
<footer>Kilde: <a href="https://www.minetegn.no/Tegnbanken-2016/">Tegnbanken / Statped</a> · CC BY-NC-ND 4.0</footer>
<script>
const norm=s=>s.toLowerCase().replace(/æ/g,'ae').replace(/ø/g,'o').replace(/å/g,'a').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const $=id=>document.getElementById(id),q=$('q'),L=$('list'),V=$('view'),M=$('meta');let W=[];
const C=$('ctrl');function syncRate(){const r=localStorage.tegnRate||'1';document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.r===r))}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{localStorage.tegnRate=b.dataset.r;syncRate();const v=V._v;if(v){v.defaultPlaybackRate=v.playbackRate=+b.dataset.r}});
const SUGG=['mamma','pappa','spise','drikke','sove','leke','ferdig','mer','hjelp','takk'];
const IV='<svg viewBox="0 0 24 24" fill="#00AEC2"><path d="M8 5.5v13l10.5-6.5z"/></svg>',II='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="M4 17l5-5 4 4 2.5-2.5L20 17"/></svg>';
fetch('words.json').then(r=>r.json()).then(d=>{W=d.map(e=>({...e,n:norm(e.w)}));render()});
function chips(){L.innerHTML='<li><div class="chips">'+SUGG.map(s=>`<button data-s="${s}">${s}</button>`).join('')+'</div></li>';
 L.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{q.value=b.dataset.s;render()})}
function render(){const s=norm(q.value.trim());L.innerHTML='';
 if(!s){M.textContent=W.length?W.length.toLocaleString('nb-NO')+' tegn':'';return chips()}
 const all=W.filter(e=>e.n.includes(s)),a=all.sort((x,y)=>(y.n.startsWith(s)-x.n.startsWith(s))||(x.n.length-y.n.length)).slice(0,60);
 M.textContent=all.length?all.length+' treff':'Ingen treff';
 if(!all.length)return chips();
 a.forEach((e,k)=>{const li=document.createElement('li');li.className='card'+(e.v?' v':'');li.style.animationDelay=Math.min(k,10)*15+'ms';li.setAttribute('role','button');li.tabIndex=0;
  li.innerHTML='<span></span>'+(e.v?IV:II);li.firstChild.textContent=e.w;li.setAttribute('aria-label',e.w+(e.v?', video':', bilde'));li.onclick=()=>show(e);L.appendChild(li)})}
function show(e){$('w').textContent=e.w;const m=$('media');m.innerHTML='';
 if(e.v){const v=document.createElement('video');v.src=e.v;v.muted=true;v.playsInline=true;v.preload='auto';
  ['playsinline','webkit-playsinline','muted','disablepictureinpicture','disableremoteplayback'].forEach(a=>v.setAttribute(a,''));
  let n=0;const rate=()=>{const r=+(localStorage.tegnRate||1);v.defaultPlaybackRate=r;v.playbackRate=r};
  const play=()=>{n=0;v.currentTime=0;rate();v.play().catch(()=>{})};
  v.addEventListener('loadedmetadata',rate);
  v.addEventListener('ended',()=>{n++;if(n<2){v.currentTime=0;rate();v.play().catch(()=>{})}else v.pause()});
  v.onclick=play;v.onerror=()=>{m.innerHTML='';C.style.display='none';imgs(e,m)};m.appendChild(v);V._v=v;
  C.style.display='flex';$('again').onclick=play;syncRate();play()}else{C.style.display='none';imgs(e,m)}
 L.style.display=M.style.display='none';V.style.display='block';q.blur();history.pushState({},'');scrollTo(0,0)}
function imgs(e,m){(e.i||[]).forEach(u=>{const i=new Image();i.className='m';i.src=u;i.alt='Tegn for '+e.w;m.appendChild(i)});if(!e.i)m.innerHTML='<p class="none">Ingen video eller bilde</p>'}
function hide(){V._v=null;V.style.display='none';L.style.display='grid';M.style.display='block';$('media').innerHTML=''}
$('back').onclick=()=>history.back();onpopstate=hide;q.oninput=()=>{hide();render()};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
