function drawBlob(im){return new Promise((res,rej)=>{const go=()=>{try{if(!im.naturalWidth)return rej(new Error('ikke lastet'));const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0);c.toBlob(b=>b?res(b):rej(new Error('toBlob')),'image/png')}catch(e){rej(e)}};im.complete?go():im.addEventListener('load',go,{once:true})})}
function prep(im){if(!im)return Promise.reject(new Error('Ingen bilde'));if(!im._b){im._b=drawBlob(im).then(b=>(im._blob=b));im._b.catch(()=>{im._b=null})}return im._b}

 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(err){if(err.name!=='AbortError')toast('Kunne ikke dele')}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Lastet ned')};
function imgs(e,m){const n=(e.i||[]).length;if(n){const g=document.createElement('div');g.className='gal';const d=document.createElement('div');d.className='dots';
 e.i.forEach((u,k)=>{const f=document.createElement('div');f.className='slide';const i=new Image();i.src=isrc(u);i.alt='Tegn for '+e.w+(n>1?' ('+(k+1)+' av '+n+')':'');i.onerror=()=>{f.remove();d.lastChild&&d.lastChild.remove();if(g.children.length<2)d.remove();syncAct();if(!g.children.length)m.innerHTML='<p class="none">Bildet mangler</p>'};f.appendChild(i);g.appendChild(f);if(n>1){const b=document.createElement('i');d.appendChild(b)}});
 m.appendChild(g);GAL=g;$('ictrl').style.display='flex';g.addEventListener('scroll',()=>{clearTimeout(g._t);g._t=setTimeout(syncAct,120)},{passive:true});g.querySelectorAll('img').forEach(i=>i.addEventListener('load',()=>{if(curImg()===i)syncAct()}));setTimeout(syncAct,50);if(n>1){m.appendChild(d);const upd=()=>{const k=Math.round(g.scrollLeft/g.clientWidth);[...d.children].forEach((b,j)=>b.classList.toggle('on',j===k))};g.addEventListener('scroll',upd,{passive:true});d.firstChild.classList.add('on');
  [...d.children].forEach((b,j)=>b.onclick=()=>g.scrollTo({left:j*g.clientWidth,behavior:'smooth'}))}}
 if(!e.i)m.innerHTML='<p class="none">Ingen video eller bilde</p>'}

// ---- Setningsmodus ----
const S=$('sent');let IDX=null;
const ckey=w=>norm(w.replace(/\(.*?\)/g,'').replace(/\s+\d+(\s+[a-z])?$/,'').trim());
function buildIdx(){IDX=new Map();for(const e of W){const k=ckey(e.w);const o=IDX.get(k);
 const sc=x=>(x.v?0:4)+(/alfabet/i.test(x.w)||/^[A-ZÆØÅ]$/.test(x.w)?2:0)+(/\(/.test(x.w)?1:0);const better=!o||sc(e)<sc(o)||(sc(e)===sc(o)&&e.w.localeCompare(o.w,'nb',{numeric:true})<0);if(better)IDX.set(k,e)}}
const SUF=['ene','ane','ene','ert','ende','ene','en','et','er','ar','te','de','ne','a','e','r','s','t'];
function lookup(t){const k=norm(t);if(IDX.has(k))return IDX.get(k);
 for(const x of SUF)if(k.length-x.length>=2&&k.endsWith(x)){const b=k.slice(0,-x.length);if(IDX.has(b))return IDX.get(b);if(IDX.has(b+'e'))return IDX.get(b+'e')}
 return null}
function parse(txt){if(!IDX)buildIdx();const raw=txt.split(/\s+/).map(w=>w.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,'')).filter(Boolean),out=[];
 for(let i=0;i<raw.length;i++){if(i+1<raw.length){const k=norm(raw[i]+' '+raw[i+1]);if(IDX.has(k)){out.push({t:raw[i]+' '+raw[i+1],e:IDX.get(k)});i++;continue}}
  out.push({t:raw[i],e:lookup(raw[i])})}return out}
window.tegnParse=parse;
// ---- lyd: forhåndsgenerert norsk kvinnestemme (audio/<id>.mp3), Web Speech som reserve ----
let AMAP=null;fetch('audio.json').then(r=>r.json()).then(d=>AMAP=d).catch(()=>{});
const TEMPO={rolig:{r:0.75,p:400},rask:{r:1.2,p:80}};const tempo=()=>TEMPO[localStorage.tegnTempo2]||TEMPO.rolig;
const AU=new Audio();AU.preload='auto';AU.setAttribute('playsinline','');window.AU=AU;
function audioFor(x){if(!AMAP)return null;let id=AMAP[norm(x.t)];if(id==null&&x.e)id=AMAP[ckey(x.e.w)];return id==null?null:'audio/'+id+'.mp3'}
let VOICE=null;const KEEP=[];
function loadVoices(){try{const nb=speechSynthesis.getVoices().filter(v=>/^nb|^no/i.test(v.lang));VOICE=nb.find(v=>/nora/i.test(v.name))||nb.find(v=>/^nb/i.test(v.lang))||null}catch(e){}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.addEventListener&&speechSynthesis.addEventListener('voiceschanged',loadVoices)}
function ttsSpeak(text,rate){return new Promise(res=>{if(!('speechSynthesis' in window))return setTimeout(res,700);loadVoices();
 const u=new SpeechSynthesisUtterance(text);u.lang='nb-NO';if(VOICE)u.voice=VOICE;u.rate=rate;KEEP.push(u);if(KEEP.length>20)KEEP.shift();
 let done=false;const f=()=>{if(!done){done=true;res()}};u.onend=f;u.onerror=f;setTimeout(f,(1800+text.length*200)/rate);speechSynthesis.speak(u)})}
function playClip(src,rate){return new Promise(res=>{let done=false;const f=()=>{if(done)return;done=true;AU.removeEventListener('ended',f);AU.removeEventListener('error',f);res()};
 AU.addEventListener('ended',f);AU.addEventListener('error',f);if(!AU.src.endsWith(src))AU.src=src;else AU.currentTime=0;
 AU.defaultPlaybackRate=AU.playbackRate=rate;AU.preservesPitch=true;AU.play().catch(f);setTimeout(f,6000/rate)})}
function say(x){const t=tempo(),src=audioFor(x);return src?playClip(src,t.r):ttsSpeak(x.t,t.r)}
// avspilling
let SEQ=[],POS=0,RUN=0,SV=null,PAUSED=false;const ST=$('sstage'),SW=$('sword');
function sv(){if(SV)return SV;SV=document.createElement('video');SV.muted=true;SV.playsInline=true;SV.preload='auto';
 ['playsinline','webkit-playsinline','muted','disablepictureinpicture','disableremoteplayback'].forEach(a=>SV.setAttribute(a,''));ST.prepend(SV);SV.onclick=()=>playFrom(POS);return SV}
function drawWords(){$('swords').innerHTML='';SEQ.forEach((x,i)=>{const b=document.createElement('button');b.textContent=x.t;b.className=(x.e?'':'miss')+(i===POS?' on':'');b.onclick=()=>playFrom(i);$('swords').appendChild(b)})}
function playVideo(v,src){return new Promise(res=>{const r=1;let done=false;const end=()=>{if(done)return;done=true;v.removeEventListener('ended',end);v.removeEventListener('error',end);v.removeEventListener('timeupdate',tu);res()};
 const tu=()=>{if(v.duration&&v.currentTime>=v.duration*0.85)end()};v.addEventListener('timeupdate',tu);v.addEventListener('ended',end);v.addEventListener('error',end);if(v.getAttribute('src')!==src)v.src=src;else v.currentTime=0;
 v.defaultPlaybackRate=v.playbackRate=r;v.addEventListener('loadedmetadata',()=>{v.defaultPlaybackRate=v.playbackRate=r},{once:true});v.play().catch(end);setTimeout(end,15000)})}
function preload(i){const x=SEQ[i];if(!x)return;if(x.e&&x.e.v)fetch(x.e.v,{mode:'no-cors'}).catch(()=>{});const a=audioFor(x);if(a)fetch(a).catch(()=>{})}
function setBtn(){return;$('spause').innerHTML=PAUSED||POS>=SEQ.length?'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15L19.5 12z"/></svg>Spill':'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>Pause'}
// Viktig for iOS: første lyd og video startes synkront i trykket (ingen await/cancel før).
function playFrom(i){const run=++RUN;PAUSED=false;ST.style.display='block';$('sctrl').style.display='flex';$('splay').parentNode.style.display='none';POS=i;setBtn();step(run)}
async function step(run){while(POS<SEQ.length){if(run!==RUN)return;const x=SEQ[POS];drawWords();const v=sv();
  const a=say(x);let b;if(x.e&&x.e.v){SW.style.display='none';v.style.display='block';b=playVideo(v,x.e.v)}
  else{v.pause();v.style.display='none';SW.textContent=x.t;SW.style.display='grid';b=new Promise(r=>setTimeout(r,700))}
  preload(POS+1);await Promise.all([a,b]);if(run!==RUN)return;await new Promise(r=>setTimeout(r,tempo().p));if(run!==RUN)return;POS++}
 drawWords();setBtn()}

function micInit(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return;document.body.classList.add('hasmic');let rec=null,cur=null;
 const off=()=>{if(cur)cur.classList.remove('on');cur=null;rec=null};
 const bind=(inp,btn)=>{btn.addEventListener('pointerdown',e=>e.preventDefault());btn.addEventListener('mousedown',e=>e.preventDefault());
  btn.onclick=()=>{if(rec){const same=cur===btn;try{rec.stop()}catch(e){}off();if(same)return}
   let r;try{r=new R()}catch(e){toast('Diktering støttes ikke her');return}
   r.lang='nb-NO';r.interimResults=true;r.continuous=false;r.maxAlternatives=1;const base=inp.value&&inp.tagName==='TEXTAREA'?inp.value.replace(/\s*$/,' '):'';
   r.onresult=e=>{let t='';for(const x of e.results)t+=x[0].transcript;inp.value=(base+t).replace(/^\s+/,'');inp.dispatchEvent(new Event('input',{bubbles:true}))};
   r.onerror=e=>{const m={'not-allowed':'Mikrofon ikke tillatt','service-not-allowed':'Diktering ikke tilgjengelig','no-speech':'Hørte ingenting','audio-capture':'Fant ingen mikrofon','network':'Ingen nettverk for diktering'}[e.error];if(m)toast(m);off()};
   r.onend=()=>{if(rec===r)off()};
   try{r.start();rec=r;cur=btn;btn.classList.add('on')}catch(e){toast('Kunne ikke starte diktering');off()}}};
 bind(q,$('qm'));bind($('stext'),$('sm'))}
