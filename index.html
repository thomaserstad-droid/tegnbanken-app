<style>
@font-face{font-family:Nunito;src:url(fonts/Nunito.ttf) format("truetype");font-weight:200 1000;font-display:swap}
:root{--navy:#0A1A3A;--yellow:#FFD84D;--cyan:#8FD9F0;--glass:#ffffff1f;--bg:linear-gradient(#00D7D9 0,#00AEC2 220px,#0A6A96 520px,#0B3E73 900px,#0A2A5A)}
@media (prefers-color-scheme:dark){:root{--bg:linear-gradient(#0A6A96 0,#0B3E73 260px,#0A2A5A 600px,#061733);--glass:#ffffff14}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0A2A5A}
body{margin:0;min-height:100vh;font-family:Nunito,ui-rounded,system-ui,sans-serif;color:#fff;background:var(--bg) no-repeat;background-attachment:fixed}
header{position:sticky;top:0;z-index:5;padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 12px calc(16px + env(safe-area-inset-left));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:#00b9c833}
@media (prefers-color-scheme:dark){header{background:#0a3a6a55}}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.brand svg{width:36px;height:36px;flex:none}
.brand h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.2px}
.search{position:relative}
.search svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:20px;height:20px;pointer-events:none}
input{width:100%;height:54px;font:inherit;font-size:18px;font-weight:800;color:#fff;padding:0 18px 0 48px;border-radius:999px;border:2px solid var(--cyan);background:var(--navy);outline:none;-webkit-appearance:none;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#8fa8c8;font-weight:700}
input:focus{border-color:var(--yellow);box-shadow:0 0 0 4px #FFD84D55}
main{padding:8px calc(16px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.meta{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.8;margin:8px 4px 10px}
#list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.card{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:12px 16px;border-radius:16px;background:#fff;color:var(--navy);font-size:18px;font-weight:800;box-shadow:0 4px 0 #0003;cursor:pointer;transition:transform .1s;animation:in .2s ease both}
@media (prefers-color-scheme:dark){.card{background:#13325c;color:#fff;box-shadow:0 4px 0 #0005}}
.card:active{transform:scale(.97)}
.card svg{width:20px;height:20px;flex:none;opacity:.55}
.card.v svg{opacity:1}
.empty{padding:28px 6px;font-size:15px;font-weight:700;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chips button{font:inherit;font-size:16px;font-weight:800;min-height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--glass);color:#fff}
.chips button:active{background:var(--yellow);color:var(--navy)}
#view{display:none;animation:in .2s ease both}
.top{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
#back{flex:none;width:52px;height:52px;border-radius:18px;border:0;background:var(--yellow);box-shadow:0 4px 0 #0003;display:grid;place-items:center}
#back:active{transform:scale(.96)}
#w{margin:0;font-size:26px;font-weight:1000;line-height:1.15;text-shadow:0 2px 0 #0004}
.stage{border-radius:22px;overflow:hidden;background:#1D3A66;box-shadow:0 6px 0 #0003}
video,img.m{display:block;width:100%}img.m{background:#fff}img.m+img.m{border-top:3px solid #1D3A66}
.none{padding:40px 16px;text-align:center;font-weight:700;opacity:.8}
video{cursor:pointer}
video::-webkit-media-controls,video::-webkit-media-controls-panel,video::-webkit-media-controls-overlay-play-button,video::-webkit-media-controls-start-playback-button,video::-webkit-media-controls-play-button{display:none!important;-webkit-appearance:none;opacity:0}
.ctrl{display:none;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:16px;font-weight:900;min-height:48px;padding:0 18px;border:0;border-radius:999px;background:var(--yellow);color:var(--navy);box-shadow:0 4px 0 #0003}
.pill:active,.seg button:active{transform:scale(.96)}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--navy);border:2px solid var(--cyan)}
.seg button{font:inherit;font-size:15px;font-weight:800;min-height:40px;min-width:72px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:#cfe3f5}
.seg button[aria-pressed=true]{background:var(--yellow);color:var(--navy)}
header .brand{justify-content:flex-start}.brand .hbtn svg{width:18px;height:18px}.hbtn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:15px;font-weight:900;min-height:40px;padding:0 14px;border:0;border-radius:999px;background:var(--yellow);color:var(--navy);box-shadow:0 3px 0 #0003}
.hbtn:active{transform:scale(.96)}
.backbtn{flex:none;width:52px;height:52px;border-radius:18px;border:0;background:var(--yellow);box-shadow:0 4px 0 #0003;display:grid;place-items:center}
.ttl{margin:0;font-size:24px;font-weight:1000}
#stext{width:100%;font:inherit;font-size:20px;font-weight:800;color:#fff;padding:14px 18px;border-radius:22px;border:2px solid var(--cyan);background:var(--navy);outline:none;resize:none;-webkit-appearance:none}
#stext:focus{border-color:var(--yellow);box-shadow:0 0 0 4px #FFD84D55}
.srow{display:flex;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap}
.swords{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.swords button{font:inherit;font-size:17px;font-weight:800;min-height:40px;padding:0 12px;border-radius:999px;border:0;background:var(--glass);color:#fff;transition:background .15s,transform .15s}
.swords button.miss{opacity:.6;text-decoration:underline dotted}
.swords button.on{background:var(--yellow);color:var(--navy);transform:scale(1.06);opacity:1}
.sstage{position:relative;aspect-ratio:4/3;display:none}.sstage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#1D3A66}
.sword{position:absolute;inset:0;display:none;place-items:center;font-size:44px;font-weight:1000;text-shadow:0 3px 0 #0006}
.pill.ghost{background:var(--glass);color:#fff}
header{transition:padding-top .35s cubic-bezier(.2,.8,.2,1),background .3s}
.brand h1,.brand>svg{transition:all .35s cubic-bezier(.2,.8,.2,1)}
body.home header{padding-top:calc(26vh + env(safe-area-inset-top));background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
body.home .brand{flex-direction:column;gap:10px;margin-bottom:26px}
body.home .brand>svg{width:88px;height:88px}
body.home .brand h1{font-size:26px;opacity:.95}
body.home input{height:60px;font-size:20px;box-shadow:0 5px 0 #0003}
body.home #meta{display:none}
body.home .sset{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}.seg.sm{padding:3px;border-width:1.5px}.seg.sm button{font-size:13px;min-height:34px;min-width:0;padding:0 12px}
footer{position:fixed;left:0;right:0;bottom:0}
.hbtn{position:absolute;top:calc(12px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));background:var(--glass);color:#fff;box-shadow:none;font-size:14px;min-height:38px;padding:0 12px}
body:not(.home) .hbtn{position:static;margin-left:auto}
footer{font-size:11px;font-weight:700;opacity:.5;text-align:center;padding:4px 16px calc(14px + env(safe-area-inset-bottom))}
footer a{color:inherit}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body class="home">
<header><div class="brand"><svg viewBox="86 86 340 340" aria-hidden="true"><circle cx="256" cy="256" r="150" fill="none" stroke="#fff" stroke-width="30"/><g fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"><path d="M206 300V214M238 300V186M270 300V192M302 300V222"/><path d="M190 280q-10 66 66 66 62 0 62-60v-50"/><path d="M206 300q-24-24-44-6"/></g><path d="M352 150l9 18 20 3-14 14 3 20-18-10-18 10 3-20-14-14 20-3z" fill="#FFD84D" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg><h1>Tegnbanken</h1><button id="sentBtn" class="hbtn" aria-label="Setning"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h13"/></svg>Setning</button></div>
<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="#8FD9F0" stroke-width="3" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="7"/><path d="M16 16l5 5"/></svg>
<input id="q" type="search" placeholder="Søk" aria-label="Søk etter tegn" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"></div></header>
<main><div class="meta" id="meta"></div><ul id="list" aria-live="polite"></ul>
<section id="view"><div class="top"><button id="back" aria-label="Tilbake"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A1A3A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg></button><h2 id="w"></h2></div><div class="stage" id="media"></div><div class="ctrl" id="ctrl"><button id="again" class="pill"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg>Spill av igjen</button><div class="seg" role="group" aria-label="Fart"><button data-r="1">Normal</button><button data-r="0.5">0,5x</button></div></div></section><section id="sent" hidden><div class="top"><button id="sback" class="backbtn" aria-label="Tilbake"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A1A3A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg></button><h2 class="ttl">Setning</h2></div>
<div class="sset"><div class="seg sm" id="stempo" role="group" aria-label="Tempo"><button data-t="rolig">Rolig</button><button data-t="rask">Rask</button></div><div class="seg sm" id="svrate" role="group" aria-label="Videofart"><button data-r="1">Video 1x</button><button data-r="0.5">0,5x</button></div></div>
<textarea id="stext" rows="2" placeholder="Skriv en setning" autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
<div class="srow"><button id="splay" class="pill"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15L19.5 12z"/></svg><span>Spill</span></button></div>
<div id="swords" class="swords" aria-live="polite"></div>
<div class="stage sstage" id="sstage"><div class="sword" id="sword"></div></div>
<div class="ctrl" id="sctrl" style="display:none"><button id="spause" class="pill">Pause</button><button id="sagain" class="pill ghost">Spill av igjen</button></div>
</section></main>
<footer>Kilde: <a href="https://www.minetegn.no/Tegnbanken-2016/">Tegnbanken / Statped</a> · CC BY-NC-ND 4.0</footer>
<script>
const norm=s=>s.toLowerCase().replace(/æ/g,'ae').replace(/ø/g,'o').replace(/å/g,'a').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const $=id=>document.getElementById(id),q=$('q'),L=$('list'),V=$('view'),M=$('meta');let W=[];
const C=$('ctrl');function syncRate(){const r=localStorage.tegnRate||'1';document.querySelectorAll('#ctrl .seg button,#svrate button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.r===r))}
document.querySelectorAll('#ctrl .seg button').forEach(b=>b.onclick=()=>{localStorage.tegnRate=b.dataset.r;syncRate();const v=V._v;if(v){v.defaultPlaybackRate=v.playbackRate=+b.dataset.r}});
const SUGG=['mamma','pappa','spise','drikke','sove','leke','ferdig','mer','hjelp','takk'];
const IV='<svg viewBox="0 0 24 24" fill="#00AEC2"><path d="M8 5.5v13l10.5-6.5z"/></svg>',II='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="M4 17l5-5 4 4 2.5-2.5L20 17"/></svg>';
fetch('words.json').then(r=>r.json()).then(d=>{W=d.map(e=>({...e,n:norm(e.w)}));render()});
function chips(){L.innerHTML='<li><div class="chips">'+SUGG.map(s=>`<button data-s="${s}">${s}</button>`).join('')+'</div></li>';
 L.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{q.value=b.dataset.s;render()})}
function render(){const s=norm(q.value.trim());L.innerHTML='';
 if(!s){M.textContent='';document.body.classList.add('home');return}document.body.classList.remove('home');
 const all=W.filter(e=>e.n.includes(s)),a=all.sort((x,y)=>(y.n.startsWith(s)-x.n.startsWith(s))||(x.n.length-y.n.length)).slice(0,60);
 M.textContent=all.length?all.length+' treff':'Ingen treff';
 if(!all.length)return;
 a.forEach((e,k)=>{const li=document.createElement('li');li.className='card'+(e.v?' v':'');li.style.animationDelay=Math.min(k,10)*15+'ms';li.setAttribute('role','button');li.tabIndex=0;
  li.innerHTML='<span></span>'+(e.v?IV:II);li.firstChild.textContent=e.w;li.setAttribute('aria-label',e.w+(e.v?', video':', bilde'));li.onclick=()=>show(e);L.appendChild(li)})}
function show(e){$('w').textContent=e.w;const m=$('media');m.innerHTML='';
 if(e.v){const v=document.createElement('video');v.src=e.v;v.muted=true;v.playsInline=true;v.preload='auto';
  ['playsinline','webkit-playsinline','muted','disablepictureinpicture','disableremoteplayback'].forEach(a=>v.setAttribute(a,''));
  let n=0;const rate=()=>{const r=+(localStorage.tegnRate||1);v.defaultPlaybackRate=r;v.playbackRate=r};
  const play=()=>{n=0;v.currentTime=0;rate();v.play().catch(()=>{})};
  v.addEventListener('loadedmetadata',rate);
  v.addEventListener('ended',()=>{n++;if(n<2){v.currentTime=0;rate();v.play().catch(()=>{})}else v.pause()});
  v.onclick=play;v.onerror=()=>{m.innerHTML='';C.style.display='none';imgs(e,m)};m.appendChild(v);V._v=v;
  C.style.display='flex';$('again').onclick=play;syncRate();play()}else{C.style.display='none';imgs(e,m)}
 L.style.display=M.style.display='none';V.style.display='block';q.blur();history.pushState({},'');scrollTo(0,0)}
function imgs(e,m){(e.i||[]).forEach(u=>{const i=new Image();i.className='m';i.src=u;i.alt='Tegn for '+e.w;m.appendChild(i)});if(!e.i)m.innerHTML='<p class="none">Ingen video eller bilde</p>'}
function hide(){V._v=null;V.style.display='none';L.style.display='grid';M.style.display='block';$('media').innerHTML=''}

// ---- Setningsmodus ----
const S=$('sent');let IDX=null;
const ckey=w=>norm(w.replace(/\(.*?\)/g,'').replace(/\s+\d+(\s+[a-z])?$/,'').trim());
function buildIdx(){IDX=new Map();for(const e of W){const k=ckey(e.w);const o=IDX.get(k);
 const sc=x=>(x.v?0:4)+(/alfabet/i.test(x.w)||/^[A-ZÆØÅ]$/.test(x.w)?2:0)+(/\(/.test(x.w)?1:0);const better=!o||sc(e)<sc(o)||(sc(e)===sc(o)&&e.w.localeCompare(o.w,'nb',{numeric:true})<0);if(better)IDX.set(k,e)}}
const SUF=['ene','ane','ene','ert','ende','ene','en','et','er','ar','te','de','ne','a','e','r','s','t'];
function lookup(t){const k=norm(t);if(IDX.has(k))return IDX.get(k);
 for(const x of SUF)if(k.length-x.length>=2&&k.endsWith(x)){const b=k.slice(0,-x.length);if(IDX.has(b))return IDX.get(b);if(IDX.has(b+'e'))return IDX.get(b+'e')}
 return null}
function parse(txt){if(!IDX)buildIdx();const raw=txt.split(/\s+/).map(w=>w.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,'')).filter(Boolean),out=[];
 for(let i=0;i<raw.length;i++){if(i+1<raw.length){const k=norm(raw[i]+' '+raw[i+1]);if(IDX.has(k)){out.push({t:raw[i]+' '+raw[i+1],e:IDX.get(k)});i++;continue}}
  out.push({t:raw[i],e:lookup(raw[i])})}return out}
window.tegnParse=parse;
// ---- lyd: forhåndsgenerert norsk kvinnestemme (audio/<id>.mp3), Web Speech som reserve ----
let AMAP=null;fetch('audio.json').then(r=>r.json()).then(d=>AMAP=d).catch(()=>{});
const TEMPO={rolig:{r:0.75,p:400},rask:{r:1.2,p:80}};const tempo=()=>TEMPO[localStorage.tegnTempo2]||TEMPO.rolig;
const AU=new Audio();AU.preload='auto';AU.setAttribute('playsinline','');window.AU=AU;
function audioFor(x){if(!AMAP)return null;let id=AMAP[norm(x.t)];if(id==null&&x.e)id=AMAP[ckey(x.e.w)];return id==null?null:'audio/'+id+'.mp3'}
let VOICE=null;const KEEP=[];
function loadVoices(){try{const nb=speechSynthesis.getVoices().filter(v=>/^nb|^no/i.test(v.lang));VOICE=nb.find(v=>/nora/i.test(v.name))||nb.find(v=>/^nb/i.test(v.lang))||null}catch(e){}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.addEventListener&&speechSynthesis.addEventListener('voiceschanged',loadVoices)}
function ttsSpeak(text,rate){return new Promise(res=>{if(!('speechSynthesis' in window))return setTimeout(res,700);loadVoices();
 const u=new SpeechSynthesisUtterance(text);u.lang='nb-NO';if(VOICE)u.voice=VOICE;u.rate=rate;KEEP.push(u);if(KEEP.length>20)KEEP.shift();
 let done=false;const f=()=>{if(!done){done=true;res()}};u.onend=f;u.onerror=f;setTimeout(f,(1800+text.length*200)/rate);speechSynthesis.speak(u)})}
function playClip(src,rate){return new Promise(res=>{let done=false;const f=()=>{if(done)return;done=true;AU.removeEventListener('ended',f);AU.removeEventListener('error',f);res()};
 AU.addEventListener('ended',f);AU.addEventListener('error',f);if(!AU.src.endsWith(src))AU.src=src;else AU.currentTime=0;
 AU.defaultPlaybackRate=AU.playbackRate=rate;AU.preservesPitch=true;AU.play().catch(f);setTimeout(f,6000/rate)})}
function say(x){const t=tempo(),src=audioFor(x);return src?playClip(src,t.r):ttsSpeak(x.t,t.r)}
// avspilling
let SEQ=[],POS=0,RUN=0,SV=null,PAUSED=false;const ST=$('sstage'),SW=$('sword');
function sv(){if(SV)return SV;SV=document.createElement('video');SV.muted=true;SV.playsInline=true;SV.preload='auto';
 ['playsinline','webkit-playsinline','muted','disablepictureinpicture','disableremoteplayback'].forEach(a=>SV.setAttribute(a,''));ST.prepend(SV);SV.onclick=()=>playFrom(POS);return SV}
function drawWords(){$('swords').innerHTML='';SEQ.forEach((x,i)=>{const b=document.createElement('button');b.textContent=x.t;b.className=(x.e?'':'miss')+(i===POS?' on':'');b.onclick=()=>playFrom(i);$('swords').appendChild(b)})}
function playVideo(v,src){return new Promise(res=>{const r=+(localStorage.tegnRate||1);let done=false;const end=()=>{if(done)return;done=true;v.removeEventListener('ended',end);v.removeEventListener('error',end);v.removeEventListener('timeupdate',tu);res()};
 const tu=()=>{if(v.duration&&v.currentTime>=v.duration*0.85)end()};v.addEventListener('timeupdate',tu);v.addEventListener('ended',end);v.addEventListener('error',end);if(v.getAttribute('src')!==src)v.src=src;else v.currentTime=0;
 v.defaultPlaybackRate=v.playbackRate=r;v.addEventListener('loadedmetadata',()=>{v.defaultPlaybackRate=v.playbackRate=r},{once:true});v.play().catch(end);setTimeout(end,15000)})}
function preload(i){const x=SEQ[i];if(!x)return;if(x.e&&x.e.v)fetch(x.e.v,{mode:'no-cors'}).catch(()=>{});const a=audioFor(x);if(a)fetch(a).catch(()=>{})}
function setBtn(){$('spause').innerHTML=PAUSED||POS>=SEQ.length?'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15L19.5 12z"/></svg>Spill':'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>Pause'}
// Viktig for iOS: første lyd og video startes synkront i trykket (ingen await/cancel før).
function playFrom(i){const run=++RUN;PAUSED=false;ST.style.display='block';$('sctrl').style.display='flex';POS=i;setBtn();step(run)}
async function step(run){while(POS<SEQ.length){if(run!==RUN)return;const x=SEQ[POS];drawWords();const v=sv();
  const a=say(x);let b;if(x.e&&x.e.v){SW.style.display='none';v.style.display='block';b=playVideo(v,x.e.v)}
  else{v.pause();v.style.display='none';SW.textContent=x.t;SW.style.display='grid';b=new Promise(r=>setTimeout(r,700))}
  preload(POS+1);await Promise.all([a,b]);if(run!==RUN)return;await new Promise(r=>setTimeout(r,tempo().p));if(run!==RUN)return;POS++}
